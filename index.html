<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      background: linear-gradient(135deg, #101a35, #2563eb);
    }

    main {
      width: min(680px, 100%);
      padding: 48px 28px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 8vw, 4rem);
    }

    p {
      margin: 0;
      color: #dbeafe;
      font-size: clamp(1rem, 3vw, 1.3rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Hola, mundo!</h1>
    <p>Esta es mi primera web publicada con GitHub Pages y protegida por Cloudflare.</p>
  </main>
</body>
</html>
